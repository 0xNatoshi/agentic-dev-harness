name: CI

on:
  pull_request:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # {{SETUP_STEP}} — e.g. actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (node-version + cache: npm)
      #                   or actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (python-version + cache: pip)
      #                   (GHES: verify a full upstream commit supported by the instance)

      - name: Install
        run: {{INSTALL_CMD}}

      - name: Lint
        run: {{LINT_CMD}}

      - name: Typecheck
        run: {{TYPECHECK_CMD}}

      - name: Build
        run: {{BUILD_CMD}}

      - name: Test
        run: {{TEST_CMD}}
